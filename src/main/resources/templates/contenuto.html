<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <title>Dettaglio contenuto</title>
    
        <link rel="stylesheet" th:href="@{/css/dettaglio-contenuto.css}">
    
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
    
        <div class="all-container">
        
            <div class="card-container">
                <h1 class="card-title" th:text="${modelContenuto.titolo}">Titolo</h1>
            
                <div class="card-text">
                    <strong>Categoria:</strong> <span th:text="${modelContenuto.categoria}"></span>
                </div>
                <div class="card-text">
                    <strong>Anno:</strong> <span th:text="${modelContenuto.anno}"></span>
                </div>
                <div class="card-text">
                    <strong>Descrizione:</strong> <span th:text="${modelContenuto.descrizione}"></span>
                </div>
            
                <div sec:authorize="hasAuthority('ADMIN')">
                    <form th:action="@{/admin/dettaglioContenuto/{id}/elimina(id=${modelContenuto.id})}" method="post">
                        <button type="submit" class="btn-danger">
                            <i class="fa-solid fa-trash"></i> Elimina contenuto
                        </button>
                    </form>
                </div>
            </div>
        
            <h2 class="scritta">Tutte Le Recensioni</h2>
        
            <div th:if="${#lists.isEmpty(modelContenuto.recensioni)}">
                <p class="scritta">Nessuna recensione presente.</p>
            </div>
        
            <div class="reviews-grid">
                <div th:each="r : ${modelRecensioni}" class="review-card">
                
                    <strong th:text="${modelContenuto.titolo}">Titolo</strong>
                
                    <div style="font-size: 14px;">
                        Scritta da: <span th:text="${r.utente.username}"></span>
                    </div>
                
                    <div class="stelle">
                        <span th:text="${r.stelle}"></span> <i class="fa-solid fa-star"></i>
                    </div>
                
                    <div class="review-text-box">
                        <span th:text="${r.testo}"></span>
                    </div>
                
                    <div style="font-size: 12px; color: #4a5568;">
                        <span th:text="${#temporals.format(r.dataEOra, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                
                    <form th:if="${#authentication.name == r.utente.username}"
                        th:action="@{/r/{id}/elimina(id=${r.id})}"
                        method="post">
                        <button type="submit" class="btn-danger">
                            <i class="fa-solid fa-trash"></i> Elimina recensione
                        </button>
                    </form>
                </div>
            </div>
        
            <div sec:authorize="isAuthenticated()" class="card-container" style="margin-top: 20px;">
                <h2 class="card-title">Inserisci nuova recensione</h2>
            
                <form th:action="@{/recensioni/nuova}" method="post">
                    <input type="hidden" name="contenutoId" th:value="${modelContenuto.id}">
                
                    <textarea name="testo" class="form-field" placeholder="Scrivi la tua opinione..." required></textarea>
                
                    <input type="number" name="stelle" class="form-field" placeholder="Voto (1-5)" min="1" max="5" required>
                
                    <button type="submit" class="btn-principale">Pubblica</button>
                </form>
            </div>
        
            <div sec:authorize="isAnonymous()" class="card-container">
                <p>Devi effettuare il login per scrivere una recensione.</p>
                <a th:href="@{/login}" class="link">Fai il login</a>
            </div>
        
            <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
                <a th:href="@{/listaContenuti}" class="link">Torna alla lista</a>
                <a th:href="@{/home}" class="link">
                    <i class="fa-solid fa-house"></i> Torna alla home
                </a>
            </div>
    
        </div>

    </body>
</html>
