<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <th:block>
        <link sec:authorize="hasAuthority('ADMIN')" rel="stylesheet" th:href="@{/css/home-admin.css}">
        
        <link sec:authorize="hasAuthority('USER')" rel="stylesheet" th:href="@{/css/home-user.css}">
        
        <link sec:authorize="!isAuthenticated()" rel="stylesheet" th:href="@{/css/home-guest.css}">
    </th:block>
    
</head>
<body>

    <div class="all-container">
        <h2 class="scritta">Scegli cosa vuoi fare:</h2>
        
        <div class="menu-container">
            
            <div class="menu-item">
                <a th:href="@{/recensioni}" class="link">
                    <i class="fa-solid fa-list"></i>
                    Vedi tutte le recensioni
                </a>
            </div>
            
            <div class="menu-item">
                <a th:href="@{/recensioni/cerca}" class="link">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Cerca recensioni
                </a>
            </div>
            
            <div class="menu-item">
                <a th:href="@{/listaContenuti}" class="link">
                    <i class="fa-solid fa-rectangle-list"></i>
                    Lista contenuti
                </a>
            </div>
            
            <div sec:authorize="isAuthenticated()" class="menu-item">
                <a th:href="@{/recensioni/mie}" class="link">
                    <i class="fa-solid fa-address-card"></i>
                    Le mie recensioni
                </a>
            </div>
                
            <div sec:authorize="isAuthenticated()" class="menu-item">
                <a th:href="@{/recensioni/nuova}" class="link">
                    <i class="fa-solid fa-plus"></i>
                    Inserisci nuova recensione
                </a>
            </div>
            
            <div sec:authorize="hasAuthority('ADMIN')" class="menu-item">
                <a th:href="@{/admin/nuovoContenuto}" class="link">
                    <i class="fa-solid fa-circle-plus"></i>
                    Inserisci nuovo contenuto
                </a>
            </div>
            
        </div>
        
        <div sec:authorize="hasAuthority('ADMIN')">
            <a th:href="@{home/cambiaRuolo}" class="link">
                <i class="fa-solid fa-user-gear"></i>
                Cambia Ruolo Degli Utenti
            </a>
        </div>
        
        <div sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout
                </button>
            </form>
        </div>
        
        <div sec:authorize="!isAuthenticated()" class="guest-login">
            <a th:href="@{/login}" class="link-login">Login</a>
            
            <a th:href="@{/registrazione}" class="link-signin">Registrati</a>
        </div>
        
        
    </div>
    

</body>
</html>
