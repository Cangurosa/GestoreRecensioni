<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>

<p>Scegli cosa vuoi fare:</p>

<a th:href="@{/recensioni}">Vedi tutte le recensioni</a>

<br><br>

<div sec:authorize="isAuthenticated()">
    <a th:href="@{/recensioni/mie}">Le mie recensioni</a>

    <br><br>

    <a th:href="@{/recensioni/nuova}">Inserisci nuova recensione</a>

    <br><br>
</div>

<a th:href="@{/recensioni/cerca}">Cerca recensioni</a>

<br><br>

<div sec:authorize="isAuthenticated()">
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</div>

<div sec:authorize="!isAuthenticated()">
    <a th:href="@{/login}">Login</a>

    <br><br>

    <a th:href="@{/registrazione}">Registrati</a>
</div>

</body>
</html>
